version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      include:
        - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      gradle-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      gradle-minor-and-patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      include:
        - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions-minor-and-patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
