version: 2
registries:
  fintlabs:
    type: maven-repository
    url: https://repo.fintlabs.no/releases

updates:
  - package-ecosystem: "gradle"
    registries:
      - fintlabs
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      include:
        - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      gradle-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      gradle-minor-and-patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Oslo"
    cooldown:
      default-days: 7
      include:
        - "*"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      github-actions-security-updates:
        applies-to: "security-updates"
        patterns:
          - "*"
      github-actions-minor-and-patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
